<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #111111;
    --border: #d9d9d9;
    --focus: #888888;
    --field-bg: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --text: #f2f2f2;
      --border: #3a3a3a;
      --focus: #888888;
      --field-bg: #171717;
    }
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }

  #app {
    min-height: 100vh;
    padding: 24px;
  }

  #fields {
    width: min(900px, 100%);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  textarea {
    display: block;
    width: 100%;
    min-height: 72px;
    resize: vertical;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--field-bg);
    color: var(--text);
    font: inherit;
    line-height: 1.45;
  }

  textarea:focus {
    border-color: var(--focus);
  }

  body.blank #app {
    visibility: hidden;
  }

  body.blank {
    cursor: default;
  }

  @media (max-width: 600px) {
    #app {
      padding: 12px;
    }

    textarea {
      min-height: 64px;
    }
  }
</style>
</head>
<body>
<main id="app">
  <section id="fields"></section>
</main>

<script>
(() => {
  const fields = document.getElementById("fields");
  let blanked = false;
  let lastClick = 0;

  function addField(value = "") {
    const textarea = document.createElement("textarea");
    textarea.value = value;
    textarea.autocomplete = "off";
    textarea.spellcheck = false;
    fields.appendChild(textarea);
    return textarea;
  }

  function ensureTrailingEmptyField() {
    const all = [...fields.querySelectorAll("textarea")];
    if (!all.length) {
      addField();
      return;
    }

    const last = all[all.length - 1];
    if (last.value.length > 0) {
      addField();
    }
  }

  function removeEmptyFieldsExceptLast() {
    const all = [...fields.querySelectorAll("textarea")];

    all.forEach((textarea, index) => {
      const isLast = index === all.length - 1;
      if (!isLast && textarea.value.length === 0) {
        textarea.remove();
      }
    });

    if (!fields.querySelector("textarea")) {
      addField();
    }
  }

  function handleInput(event) {
    if (event.target.value.length > 0) {
      ensureTrailingEmptyField();
    } else {
      removeEmptyFieldsExceptLast();
    }
  }

  function toggleBlank(event) {
    const now = Date.now();

    if (now - lastClick < 450) {
      event.preventDefault();
      blanked = !blanked;
      document.body.classList.toggle("blank", blanked);
      lastClick = 0;
      return;
    }

    lastClick = now;
  }

  fields.addEventListener("input", handleInput);
  document.addEventListener("dblclick", toggleBlank, true);

  addField();
})();
</script>
</body>
</html>
