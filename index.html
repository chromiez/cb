<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cb</title>
<style>
  :root {
    --bg: #ffffff;
    --field-bg: #f1f1f1;
    --fg: #111111;
    --caret: #111111;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --field-bg: #161616;
      --fg: #eaeaea;
      --caret: #eaeaea;
    }
  }

  * {
    box-sizing: border-box;
    touch-action: manipulation;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
  }

  #fields {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    overflow-y: auto;
  }

  textarea {
    flex: 1 0 auto;
    min-height: 96px;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: var(--field-bg);
    border-radius: 14px;
    color: var(--fg);
    caret-color: var(--caret);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    padding: 20px;
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    z-index: 999;
  }

  #lock {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    z-index: 1000;
  }

  #lock textarea {
    border-radius: 0;
  }
</style>
</head>
<body>

<div id="fields"></div>
<div id="overlay"></div>
<div id="lock">
  <textarea id="pinInput" autocomplete="off" spellcheck="false"></textarea>
</div>

<script>
/*
  cb, a clean shared clipboard for static hosting on GitHub Pages.

  There is no server in this repository. Cross device sync runs through
  ntfy.sh, a free public push service with no signup. Every browser that
  loads this page publishes and listens on the same fixed topic name, so
  a phone and a desktop visiting the same URL share the same fields.

  Anyone who knows the topic name below can read or write this pad, since
  ntfy topics are not private unless self hosted with auth. Treat this as
  a convenience tool, not a place for sensitive text.
*/

const TOPIC = 'cb-chromiez-clip-239f88cdca46';
const NTFY_BASE = 'https://ntfy.sh/' + TOPIC;

const container = document.getElementById('fields');
const overlay = document.getElementById('overlay');

let state = [''];
let elements = [];
let suppressPublish = false;
let publishTimer = null;
let pendingRemote = null;

function createFieldEl(value) {
  const el = document.createElement('textarea');
  el.value = value;
  el.setAttribute('autocomplete', 'off');
  el.setAttribute('autocapitalize', 'off');
  el.setAttribute('spellcheck', 'false');
  el.addEventListener('input', () => handleInput(el));
  el.addEventListener('blur', maybeApplyPendingRemote);
  return el;
}

function renderAll() {
  container.innerHTML = '';
  elements = state.map(value => {
    const el = createFieldEl(value);
    container.appendChild(el);
    return el;
  });
}

function handleInput(el) {
  const idx = elements.indexOf(el);
  if (idx === -1) return;
  const value = el.value;
  state[idx] = value;

  if (value === '' && idx !== elements.length - 1) {
    elements.splice(idx, 1);
    state.splice(idx, 1);
    el.remove();
  } else if (value !== '' && idx === elements.length - 1) {
    const newEl = createFieldEl('');
    elements.push(newEl);
    state.push('');
    container.appendChild(newEl);
  }

  schedulePublish();
}

function schedulePublish() {
  clearTimeout(publishTimer);
  publishTimer = setTimeout(publishState, 450);
}

// Normal saves wait briefly in case more typing is coming, so the network
// is not spammed on every keystroke. That short wait is a problem if the
// tab closes before it fires, since browsers cancel any request already
// in flight the moment the page unloads. This forces an immediate,
// unload-safe send the instant the tab starts closing or is backgrounded,
// so nothing typed right before closing gets lost.
function flushPendingSaveOnExit() {
  clearTimeout(publishTimer);
  if (suppressPublish) return;
  try {
    const payload = JSON.stringify(state);
    if (navigator.sendBeacon) {
      navigator.sendBeacon(NTFY_BASE, new Blob([payload], { type: 'text/plain' }));
    } else {
      fetch(NTFY_BASE, { method: 'POST', body: payload, keepalive: true });
    }
  } catch (err) {
    // best effort only, the tab is already on its way out
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) flushPendingSaveOnExit();
});
window.addEventListener('pagehide', flushPendingSaveOnExit);

async function publishState() {
  if (suppressPublish) return;
  try {
    await fetch(NTFY_BASE, {
      method: 'POST',
      body: JSON.stringify(state)
    });
  } catch (err) {
    console.error('Publish failed:', err);
  }
}

function anyFieldFocused() {
  return elements.some(el => el === document.activeElement);
}

function applyRemoteState(remote) {
  if (!Array.isArray(remote) || remote.length === 0) remote = [''];
  if (remote[remote.length - 1] !== '') remote = remote.concat(['']);
  const same = remote.length === state.length && remote.every((v, i) => v === state[i]);
  if (same) return;
  suppressPublish = true;
  state = remote.slice();
  renderAll();
  suppressPublish = false;
}

function maybeApplyPendingRemote() {
  setTimeout(() => {
    if (pendingRemote && !anyFieldFocused()) {
      const remote = pendingRemote;
      pendingRemote = null;
      applyRemoteState(remote);
    }
  }, 0);
}

function onRemoteMessage(raw) {
  let remote;
  try {
    remote = JSON.parse(raw);
  } catch (err) {
    return;
  }
  if (anyFieldFocused()) {
    pendingRemote = remote;
  } else {
    applyRemoteState(remote);
  }
}

let lastMessageId = null;
let polling = false;

async function poll(sinceLatestOnly) {
  if (polling) return;
  polling = true;
  try {
    const since = sinceLatestOnly || !lastMessageId ? 'latest' : lastMessageId;
    const res = await fetch(NTFY_BASE + '/json?poll=1&since=' + since, { cache: 'no-store' });
    if (res.ok) {
      const text = await res.text();
      const lines = text.trim().split('\n').filter(Boolean);
      for (const line of lines) {
        let data;
        try {
          data = JSON.parse(line);
        } catch (err) {
          continue;
        }
        if (data && data.id) lastMessageId = data.id;
        if (data && data.event === 'message' && typeof data.message === 'string') {
          onRemoteMessage(data.message);
        }
      }
    }
  } catch (err) {
    // network hiccup, the next scheduled poll will retry
  } finally {
    polling = false;
  }
}

// Live connection for near-instant updates while the tab is open. This is
// the fast path. It gets rebuilt every time the tab regains focus, since
// mobile browsers can silently drop a live connection in the background
// without any error firing.
let liveStream = null;

function connectLiveStream() {
  if (liveStream) {
    try { liveStream.close(); } catch (err) { /* already closed */ }
  }
  try {
    liveStream = new EventSource(NTFY_BASE + '/sse');
    liveStream.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data && data.id) lastMessageId = data.id;
        if (data && data.event === 'message' && typeof data.message === 'string') {
          onRemoteMessage(data.message);
        }
      } catch (err) {
        // ignore malformed events
      }
    };
    liveStream.onerror = () => {
      liveStream.close();
      setTimeout(connectLiveStream, 2000);
    };
  } catch (err) {
    setTimeout(connectLiveStream, 2000);
  }
}

let blanked = false;
document.addEventListener('dblclick', (event) => {
  event.preventDefault();
  blanked = !blanked;
  overlay.style.display = blanked ? 'block' : 'none';
});

function initApp() {
  renderAll();
  connectLiveStream();
  // The timed check is now just a safety net for whatever the live
  // connection missed, so it can run less often. Coming back to the tab
  // rebuilds the live connection immediately and checks right away too,
  // since that is exactly when a phone is most likely to have missed
  // something while its screen was off.
  setInterval(() => poll(false), 4000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      poll(false);
      connectLiveStream();
    }
  });
  window.addEventListener('focus', () => {
    poll(false);
    connectLiveStream();
  });
  window.addEventListener('pageshow', () => {
    poll(false);
    connectLiveStream();
  });
  poll(true);
}

/*
  Passcode gate. This is a screen lock, not real security: the page is
  static and the check runs in the visitor's own browser. Only a SHA-256
  hash of the passcode lives in this file, not the passcode itself, and
  the field looks and behaves exactly like the real clipboard fields, so
  nothing on the page signals that a check is happening at all. Someone
  who actually wants in, rather than just glancing at the page, can still
  find their way past this, a static site cannot truly stop that.
*/
const PIN_HASH = 'f98204ba6963009734f0398a80f8e44f9d3ef74ebb9c49e5d4f000bd1c102d29';
const lock = document.getElementById('lock');
const pinInput = document.getElementById('pinInput');

async function sha256Hex(text) {
  const bytes = new TextEncoder().encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(hashBuffer))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

pinInput.addEventListener('input', async () => {
  const hash = await sha256Hex(pinInput.value);
  if (hash === PIN_HASH) {
    lock.style.display = 'none';
    pinInput.blur();
    initApp();
  }
});

pinInput.focus();
</script>

</body>
</html>
