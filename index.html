<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cb</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #16181a;
    --line: #e4e6e8;
    --caret: #16181a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1210;
      --text: #e8ede9;
      --line: #24292a;
      --caret: #e8ede9;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  #fields {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  #fields textarea {
    width: 100%;
    flex-shrink: 0;
    min-height: 25vh;
    resize: none;
    border: none;
    border-bottom: 1px solid var(--line);
    outline: none;
    background: transparent;
    color: var(--text);
    caret-color: var(--caret);
    font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace;
    font-size: 15px;
    line-height: 1.6;
    padding: 20px;
  }

  #fields textarea:last-child {
    border-bottom: none;
  }

  body.blanked #fields {
    display: none;
  }
</style>
</head>
<body>

<div id="fields"></div>

<script>
/*
  No server ships with this repository. Cross device sync happens through
  kvdb.io, a free public key value store. The bucket id lives in the URL
  after the # symbol, so the page's own link is the shared pad. Opening
  the exact same link on another device reads and writes the same fields.

  This depends on a third party service staying reachable. Typing still
  works if it is not; it just will not sync until it responds again.
*/

const KVDB_HOST = 'https://kvdb.io';
const KEY_NAME = 'pad';

const container = document.getElementById('fields');

let bucketId = null;
let fields = [''];
let lastSavedJSON = JSON.stringify(fields);
let lastKnownRemoteJSON = lastSavedJSON;
let saveTimer = null;

function currentIndex(el) {
  return Array.prototype.indexOf.call(container.children, el);
}

function makeField(value) {
  const ta = document.createElement('textarea');
  ta.value = value;
  ta.spellcheck = false;
  ta.autocapitalize = 'off';
  ta.autocomplete = 'off';
  ta.addEventListener('input', onFieldInput);
  return ta;
}

function renderAll(list) {
  fields = list.length ? list.slice() : [''];
  container.innerHTML = '';
  fields.forEach(v => container.appendChild(makeField(v)));
}

function onFieldInput(e) {
  const ta = e.target;
  const idx = currentIndex(ta);
  const value = ta.value;
  fields[idx] = value;

  const isLast = idx === fields.length - 1;
  if (isLast && value.length > 0) {
    fields.push('');
    container.appendChild(makeField(''));
  } else if (!isLast && value.length === 0) {
    fields.splice(idx, 1);
    container.removeChild(ta);
  }
  scheduleSave();
}

function bucketUrl(path) {
  return KVDB_HOST + '/' + bucketId + (path ? '/' + path : '');
}

async function createBucket() {
  const res = await fetch(KVDB_HOST + '/', { method: 'POST' });
  if (!res.ok) throw new Error('Bucket creation failed: ' + res.status);
  const id = (await res.text()).trim();
  if (!id) throw new Error('Bucket creation returned an empty id');
  return id;
}

async function ensureBucket() {
  const hash = window.location.hash.replace('#', '').trim();
  if (hash) {
    bucketId = hash;
    return;
  }
  bucketId = await createBucket();
  window.location.hash = bucketId;
}

async function readRemote() {
  const res = await fetch(bucketUrl(KEY_NAME), { cache: 'no-store' });
  if (res.status === 404) return '';
  if (!res.ok) throw new Error('Read failed: ' + res.status);
  return await res.text();
}

async function writeRemote(value) {
  const res = await fetch(bucketUrl(KEY_NAME), { method: 'PUT', body: value });
  if (!res.ok) throw new Error('Write failed: ' + res.status);
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const json = JSON.stringify(fields);
    if (json === lastSavedJSON) return;
    try {
      await writeRemote(json);
      lastSavedJSON = json;
      lastKnownRemoteJSON = json;
    } catch (err) {
      console.error('Save failed:', err);
    }
  }, 500);
}

async function pollRemote() {
  if (container.contains(document.activeElement)) return;
  try {
    const raw = await readRemote();
    if (!raw || raw === lastKnownRemoteJSON) return;
    lastKnownRemoteJSON = raw;
    let list;
    try {
      list = JSON.parse(raw);
      if (!Array.isArray(list)) return;
    } catch (err) {
      return;
    }
    lastSavedJSON = raw;
    renderAll(list);
  } catch (err) {
    // Sync service unreachable this cycle, local edits still work.
  }
}

async function init() {
  renderAll(['']);
  try {
    await ensureBucket();
    const raw = await readRemote();
    if (raw) {
      lastKnownRemoteJSON = raw;
      lastSavedJSON = raw;
      let list;
      try {
        list = JSON.parse(raw);
        if (Array.isArray(list)) renderAll(list);
      } catch (err) {
        // Ignore malformed remote data, keep the blank starting field.
      }
    }
  } catch (err) {
    console.error('Startup failed:', err);
  }
  setInterval(pollRemote, 2000);
}

document.addEventListener('dblclick', () => {
  document.body.classList.toggle('blanked');
});

init();
</script>

</body>
</html>
