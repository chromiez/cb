/*
  A paste with no file attachments at all, just text or rich HTML from a
  source like Word or a web page, is left completely alone here so the
  browser's own contenteditable paste handles it, which is what actually
  keeps bold, colors, and other formatting from the source.

  A paste that includes an image is redirected: the image goes straight
  into the field it was pasted into, not the gallery, with small controls
  attached to send it to the gallery afterward or remove it.

  A paste that includes a non-image file still goes to the gallery only,
  exactly as before.
*/
function handleFieldPaste(event, el) {
  const items = event.clipboardData && event.clipboardData.items;
  if (!items) return;

  const imageFiles = [];
  const otherFiles = [];

  for (const item of items) {
    if (item.kind === 'file') {
      const file = item.getAsFile();
      if (!file) continue;
      if (file.type && file.type.startsWith('image/')) {
        imageFiles.push(file);
      } else {
        otherFiles.push(file);
      }
    }
  }

  if (imageFiles.length === 0 && otherFiles.length === 0) {
    /*
      Nothing came through as an actual file, but the pasted HTML from
      the source might still reference an image by a URL that only
      works inside that source's own page (a "blob:" or "data:" URL,
      common when copying a mix of text and an image together). Native
      paste already ran by the time this fires, so this just checks
      afterward and swaps in a permanent copy if needed.
    */
    setTimeout(() => rescueUnreliableImages(el), 0);
    return;
  }

  event.preventDefault();

  imageFiles.forEach(file => uploadImageInline(file, el));

  otherFiles.forEach(file => {
    if (file.type && file.type.startsWith('video/')) return;
    uploadImageToGallery(file);
  });
}

async function rescueUnreliableImages(el) {
  const imgs = Array.from(el.querySelectorAll('img'));
  let changed = false;

  for (const img of imgs) {
    const src = img.getAttribute('src') || '';

    if (!src.startsWith('blob:') && !src.startsWith('data:')) {
      continue;
    }

    try {
      const res = await fetch(src);
      const blob = await res.blob();

      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      const ext = (blob.type && blob.type.split('/')[1] && blob.type.split('/')[1].split('+')[0]) || 'png';
      const path = 'inline/' + id + '.' + ext;
      const fileRef = storageRef(storage, path);

      await uploadBytes(fileRef, blob);
      const url = await getDownloadURL(fileRef);

      img.src = url;
      changed = true;

    } catch (err) {
      console.error('Could not rescue a pasted image:', err);
    }
  }

  if (changed) {
    handleInput(el, { inputType: 'insertFromPaste' });
    save();
  }
}

function startGalleryListening() {
  onValue(galleryDbRef, (snapshot) => {
    galleryImages = snapshot.val() || {};
    renderGallery();
  });
}

/*
  Find-in-fields. Searches the plain text of every cb field (visible
  or collapsed) for the typed query and steps through the matches.

  Highlighting is done by splitting the matched text node and
  wrapping just that slice in a <mark> -- a plain DOM mutation, never
  through el.innerHTML and never through the Selection API. That
  matters for two reasons: it can't leak into state.h or a field's
  copy button, and -- unlike Selection.addRange() on another
  element -- it never steals focus away from the search box, which
  is what was closing the keyboard after the first typed letter.
  Every step below runs synchronously off the input/click event
  itself: no setTimeout, no debounce, no smooth scrolling, so results
  and jumps appear the instant you type or tap.
*/
let findOpen = false;
let findMatches = [];
let findMatchIndex = -1;
let activeHighlightEl = null;

function clearHighlight() {
  if (!activeHighlightEl) return;
  const parent = activeHighlightEl.parentNode;
  if (parent) {
    while (activeHighlightEl.firstChild) {
      parent.insertBefore(activeHighlightEl.firstChild, activeHighlightEl);
    }
    parent.removeChild(activeHighlightEl);
    parent.normalize();
  }
  activeHighlightEl = null;
}

/*
  Locates the single text node holding the match and wraps it in a
  <mark>. If a match happens to straddle two text nodes (only
  possible when an inline image sits in the middle of it), this
  leaves it unhighlighted rather than risk a fragile cross-node
  wrap -- the scroll-to-match below still finds and centers it.
*/
function highlightTextOffsets(el, start, end) {
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  let node;
  let pos = 0;
  let target = null;
  let localStart = 0;

  while ((node = walker.nextNode())) {
    const len = node.textContent.length;
    if (pos + len >= start) {
      target = node;
      localStart = start - pos;
      break;
    }
    pos += len;
  }

  if (!target) return null;

  const matchLen = end - start;
  if (localStart + matchLen > target.textContent.length) {
    return target.parentElement;
  }

  let middle = target;
  if (localStart > 0) {
    middle = middle.splitText(localStart);
  }
  if (matchLen < middle.textContent.length) {
    middle.splitText(matchLen);
  }

  const mark = document.createElement('mark');
  mark.className = 'find-highlight';
  middle.parentNode.insertBefore(mark, middle);
  mark.appendChild(middle);

  return mark;
}

function updateFindCount() {
  if (!findInput.value) {
    findMatchCount.textContent = '';
  } else if (findMatches.length === 0) {
    findMatchCount.textContent = '0/0';
  } else {
    findMatchCount.textContent = (findMatchIndex + 1) + '/' + findMatches.length;
  }
}

/*
  Centers target inside scrollParent, using the CURRENT (freshly
  measured) position of each -- never a cached/prior rect -- and sets
  scrollTop directly rather than calling scrollTo/scrollIntoView, so
  it's a plain instant jump with no animation and no dependence on
  the browser's own (sometimes inexact, with nested scroll areas)
  auto-scroll heuristics.
*/
function centerInScrollParent(scrollParent, target) {
  const targetRect = target.getBoundingClientRect();
  const parentRect = scrollParent.getBoundingClientRect();
  const delta = (targetRect.top + targetRect.height / 2) - (parentRect.top + parentRect.height / 2);
  scrollParent.scrollTop += delta;
}

function jumpToMatch(index, { refocusInput = false } = {}) {
  const total = findMatches.length;
  if (total === 0) return;

  clearHighlight();

  findMatchIndex = ((index % total) + total) % total;
  const match = findMatches[findMatchIndex];
  const el = elements[match.elIndex];
  const wrap = wraps[match.elIndex];
  if (!el || !wrap) return;

  if (wrap.classList.contains('collapsed')) {
    const toggleBtn = wrap.querySelector('.field-collapse-toggle-btn');
    if (toggleBtn) toggleBtn.click();
  }

  const target = highlightTextOffsets(el, match.start, match.end);
  if (target instanceof HTMLElement && target.className === 'find-highlight') {
    activeHighlightEl = target;
  }

  if (target) {
    /*
      Two passes, innermost scrollable ancestor first: center the
      match inside the field's own internal scroll, then re-measure
      its now-updated position and center THAT inside the outer list.
      Doing it in one shot (or relying on the browser's own nested
      scrollIntoView) is what left off-center matches -- each
      scrollable ancestor has to be centered using where the target
      actually ended up after the previous scroll, not before it.
    */
    centerInScrollParent(el, target);
    centerInScrollParent(container, target);
  }

  updateFindCount();

  /*
    Expanding a collapsed field above via toggleBtn.click() can shift
    focus to that button (a real click always focuses its target,
    even when fired from script). If this jump was triggered from the
    search box itself (Enter key), put focus back there so typing
    stays uninterrupted. If it was triggered from the prev/next nav
    buttons, don't -- refocusing the input would reopen the mobile
    keyboard, which is exactly what clicking those buttons should
    avoid. Just drop focus off the toggle button in that case.
  */
  if (findOpen && refocusInput) {
    findInput.focus({ preventScroll: true });
  } else if (document.activeElement && document.activeElement.classList &&
             document.activeElement.classList.contains('field-collapse-toggle-btn')) {
    document.activeElement.blur();
  }
}

function performFind(query) {
  findMatches = [];
  findMatchIndex = -1;

  if (!query) {
    clearHighlight();
    updateFindCount();
    return;
  }

  const lowerQuery = query.toLowerCase();

  elements.forEach((el, i) => {
    const lowerText = (el.textContent || '').toLowerCase();
    let from = 0;
    let idx;
    while ((idx = lowerText.indexOf(lowerQuery, from)) !== -1) {
      findMatches.push({ elIndex: i, start: idx, end: idx + lowerQuery.length });
      from = idx + lowerQuery.length;
    }
  });

  updateFindCount();

  if (findMatches.length === 0) {
    clearHighlight();
    return;
  }

  jumpToMatch(0);
}

function setFieldsEditable(editable) {
  elements.forEach(el => {
    el.contentEditable = editable ? 'true' : 'false';
  });
}

function openFind() {
  findOpen = true;
  document.body.classList.add('find-open');
  findBtn.classList.add('active');
  findBar.classList.add('open');

  /*
    Searching takes over typing entirely: the cb fields go
    non-editable so a tap on one can't steal focus or open the
    keyboard over it, and every keystroke is guaranteed to land in
    the search box until Find is closed again.
  */
  if (activeField) activeField.blur();
  setFieldsEditable(false);
  findInput.focus();

  /*
    Whatever was typed last time Find was open is still sitting in
    findInput.value -- closeFind() deliberately doesn't clear it (see
    below), so an accidental tap on the toggle, or closing Find just
    to glance at a field, doesn't lose the search. Re-run it fresh
    rather than trusting the old match list/highlight, since field
    content could have changed while Find was closed.
  */
  if (findInput.value) {
    performFind(findInput.value);
  } else {
    updateFindCount();
  }
}

function closeFind() {
  findOpen = false;
  document.body.classList.remove('find-open');
  findBtn.classList.remove('active');
  findBar.classList.remove('open');
  findInput.blur();
  clearHighlight();
  setFieldsEditable(true);

  /*
    findInput.value, findMatches, and findMatchIndex are deliberately
    left alone here -- closing Find (including an accidental tap on
    the toggle icon) shouldn't lose what was searched. Only the
    explicit Clear (X) button resets those.
  */
}

findBtn.addEventListener('mousedown', (event) => event.preventDefault());
findBtn.addEventListener('click', () => {
  if (findOpen) {
    closeFind();
  } else {
    openFind();
  }
});

findInput.addEventListener('input', () => {
  performFind(findInput.value);
});

findInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') {
    event.preventDefault();
    jumpToMatch(findMatchIndex + (event.shiftKey ? -1 : 1), { refocusInput: true });
  } else if (event.key === 'Escape') {
    closeFind();
  }
});

findPrevBtn.addEventListener('mousedown', (event) => event.preventDefault());
findNextBtn.addEventListener('mousedown', (event) => event.preventDefault());
findClearBtn.addEventListener('mousedown', (event) => event.preventDefault());
findPrevBtn.addEventListener('click', () => jumpToMatch(findMatchIndex - 1));
findNextBtn.addEventListener('click', () => jumpToMatch(findMatchIndex + 1));
findClearBtn.addEventListener('click', () => {
  findInput.value = '';
  performFind('');
  findInput.focus();
});

/*
  Jumps straight to a specific CB by number -- useful once the list
  has grown long enough that scrolling to find one by hand is slow.
  Accepts the field's current position (1-indexed, matching the "CB
  N" labels), scrolls its wrap into view, and focuses it if it's not
  currently hidden.
*/
function goToField() {
  const totalFields = elements.length;
  if (totalFields === 0) return;

  const input = window.prompt('Go to CB # (1-' + totalFields + ')');
  if (input === null) return;

  const num = parseInt(input.trim(), 10);
  if (!Number.isFinite(num) || num < 1 || num > totalFields) {
    /*
      An invalid number re-opens the prompt instead of dropping the
      whole search -- only an explicit Cancel (input === null, above)
      should back out entirely. Otherwise a typo means starting over
      by tapping the button again, which is exactly what this avoids.
    */
    window.alert('Enter a number between 1 and ' + totalFields + '.');
    goToField();
    return;
  }

  const idx = num - 1;
  const wrap = wraps[idx];
  const el = elements[idx];
  if (!wrap || !el) return;

  wrap.scrollIntoView({ behavior: 'auto', block: 'start' });

  if (!wrap.classList.contains('collapsed')) {
    el.focus({ preventScroll: true });
  }
}

goToFieldBtn.addEventListener('click', goToField);

galleryBtn.addEventListener('click', openGallery);
galleryCloseBtn.addEventListener('click', closeGallery);
lightboxCloseBtn.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (event) => {
  if (event.target === lightbox) closeLightbox();
});
galleryAddBtn.addEventListener('click', () => galleryAddInput.click());
galleryAddInput.addEventListener('change', () => {
  const files = Array.from(galleryAddInput.files || []);
  files.forEach(file => uploadImageToGallery(file));
  galleryAddInput.value = '';
});

gallerySelectAllBtn.addEventListener('click', () => {
  Object.keys(galleryImages || {}).forEach(id => selectedIds.add(id));
  renderGallery();
});

galleryDeselectAllBtn.addEventListener('click', () => {
  selectedIds.clear();
  renderGallery();
});

galleryDeleteSelectedBtn.addEventListener('click', async () => {
  const idsToDelete = Array.from(selectedIds);
  const count = idsToDelete.length;
  if (count === 0) return;

  const confirmed = window.confirm(
    'Delete ' + count + (count === 1 ? ' selected file' : ' selected files') + '? This cannot be undone.'
  );
  if (!confirmed) return;

  selectedIds.clear();
  updateSelectionBar();

  for (const id of idsToDelete) {
    const data = galleryImages[id];
    await deleteGalleryImage(id, data && data.path);
  }
});

const REST_ENDPOINT =
  'https://rtcb-81402-default-rtdb.firebaseio.com/cb.json';

function flushPendingSaveOnExit() {
  const syncPayload = getSyncPayload(state);
  const payload = JSON.stringify(syncPayload);

  if (payload === lastSavedSnapshot) {
    return;
  }

  try {
    fetch(REST_ENDPOINT, {
      method: 'PUT',
      body: payload,
      keepalive: true
    })
      .then(() => {
        saveBtn.classList.remove('error');
        updateSaveIndicator();
        flashSaved();
      })
      .catch((err) => {
        console.error('Exit save failed:', err);
      });

    lastSavedSnapshot = payload;

  } catch (err) {
    console.error('Exit save failed:', err);
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    flushPendingSaveOnExit();
  }
});

window.addEventListener('pagehide', flushPendingSaveOnExit);
window.addEventListener('beforeunload', flushPendingSaveOnExit);
window.addEventListener('blur', flushPendingSaveOnExit);
window.addEventListener('resize', flushPendingSaveOnExit);

let lastKnownScreenX = window.screenX;
let lastKnownScreenY = window.screenY;

setInterval(() => {
  if (window.screenX !== lastKnownScreenX || window.screenY !== lastKnownScreenY) {
    lastKnownScreenX = window.screenX;
    lastKnownScreenY = window.screenY;
    flushPendingSaveOnExit();
  }
}, 400);

setInterval(() => {
  const isDirty = JSON.stringify(getSyncPayload(state)) !== lastSavedSnapshot;
  if (isDirty) {
    save();
  }
}, 2000);

function anyFieldFocused() {
  return elements.some(el => el === document.activeElement);
}

function applyRemoteState(remote) {
  if (!Array.isArray(remote) || remote.length === 0) {
    remote = [{ h: '', c: false }];
  }

  if (!isHtmlEmpty(remote[remote.length - 1].h)) {
    remote = remote.concat([{ h: '', c: false }]);
  }

  const same =
    remote.length === state.length &&
    remote.every((entry, index) =>
      state[index] &&
      entry.h === state[index].h &&
      entry.c === state[index].c
    );

  if (same) {
    return;
  }

  /*
    Checkbox selection is local-only (see getSyncPayload above) and
    was never part of `remote` to begin with, so it has to be carried
    over by hand here rather than read off the incoming data -- by
    index, since that's the only correspondence between the old and
    new field lists this app tracks. Content from another device
    shouldn't silently clear selections made on this one.
  */
  const locallySelectedIndexes = new Set();
  selectedFields.forEach(el => {
    const idx = elements.indexOf(el);
    if (idx !== -1) locallySelectedIndexes.add(idx);
  });

  state = remote.map((entry, index) => ({
    h: entry.h,
    c: entry.c,
    s: locallySelectedIndexes.has(index)
  }));

  renderAll();

  lastSavedSnapshot = JSON.stringify(getSyncPayload(state));

  updateSaveIndicator();

  restoreLastFocusedFieldOnce();
  restoreBookmarkOnce();
  updateScrollHelperButtons();
}

function maybeApplyPendingRemote() {
  setTimeout(() => {
    if (pendingRemote && !anyFieldFocused()) {
      const remote = pendingRemote;

      pendingRemote = null;

      applyRemoteState(remote);
    }
  }, 0);
}

function normalizeEntry(entry) {
  if (typeof entry === 'string') {
    return { h: entry, c: false };
  }
  if (entry && typeof entry === 'object') {
    return {
      h: typeof entry.h === 'string' ? entry.h : '',
      c: !!entry.c
    };
  }
  return { h: '', c: false };
}

function normalizeRemote(val) {
  let arr;

  if (Array.isArray(val)) {
    arr = val;
  } else if (val && typeof val === 'object') {
    arr = Object.keys(val)
      .sort((a, b) => Number(a) - Number(b))
      .map(key => val[key]);
  } else {
    arr = [''];
  }

  return arr.map(normalizeEntry);
}

function startListening() {
  onValue(clipRef, (snapshot) => {
    const remote = normalizeRemote(snapshot.val());

    const localIsDirty =
      JSON.stringify(getSyncPayload(state)) !== lastSavedSnapshot;

    if (!localIsDirty) {
      pendingRemote = null;
      applyRemoteState(remote);
      return;
    }

    pendingRemote = remote;
  });
}

function initApp() {
  renderAll();

  startListening();
  startGalleryListening();

  saveBtn.style.display = 'flex';
  galleryBtn.style.display = 'flex';
  goToFieldBtn.style.display = 'flex';
  findBtn.style.display = 'flex';

  updateSaveIndicator();

  saveBtn.addEventListener('click', save);

  document.addEventListener('keydown', (event) => {
    const key = event.key.toLowerCase();

    if ((event.ctrlKey || event.metaKey) && key === 's') {
      event.preventDefault();
      save();
    } else if ((event.ctrlKey || event.metaKey) && key === 'f') {
      event.preventDefault();
      if (findOpen) {
        closeFind();
      } else {
        openFind();
      }
    } else if (event.key === 'Enter') {
      save();
    }
  });
}

const PIN_HASH =
  'f98204ba6963009734f0398a80f8e44f9d3ef74ebb9c49e5d4f000bd1c102d29';

const lock = document.getElementById('lock');
const pinInput = document.getElementById('pinInput');

async function sha256Hex(text) {
  const bytes = new TextEncoder().encode(text);

  const hashBuffer =
    await crypto.subtle.digest('SHA-256', bytes);

  return Array.from(new Uint8Array(hashBuffer))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

pinInput.addEventListener('input', async () => {
  const hash = await sha256Hex(pinInput.value);

  if (hash === PIN_HASH) {
    lock.style.display = 'none';

    pinInput.blur();

    initApp();
  }
});

pinInput.focus();
</script>
