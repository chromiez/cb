<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cb</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --divider: rgba(0, 0, 0, 0.08);
    --caret: #111111;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --fg: #eaeaea;
      --divider: rgba(255, 255, 255, 0.10);
      --caret: #eaeaea;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
  }

  #fields {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
  }

  textarea {
    flex: 1 0 auto;
    min-height: 96px;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--fg);
    caret-color: var(--caret);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    padding: 20px;
    border-bottom: 1px solid var(--divider);
  }

  textarea:last-child {
    border-bottom: none;
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    z-index: 999;
  }
</style>
</head>
<body>

<div id="fields"></div>
<div id="overlay"></div>

<script>
/*
  cb, a clean shared clipboard for static hosting on GitHub Pages.

  There is no server in this repository. Cross device sync runs through
  ntfy.sh, a free public push service with no signup. Every browser that
  loads this page publishes and listens on the same fixed topic name, so
  a phone and a desktop visiting the same URL share the same fields.

  Anyone who knows the topic name below can read or write this pad, since
  ntfy topics are not private unless self hosted with auth. Treat this as
  a convenience tool, not a place for sensitive text.
*/

const TOPIC = 'cb-chromiez-clip-239f88cdca46';
const NTFY_BASE = 'https://ntfy.sh/' + TOPIC;

const container = document.getElementById('fields');
const overlay = document.getElementById('overlay');

let state = [''];
let elements = [];
let suppressPublish = false;
let publishTimer = null;
let pendingRemote = null;

function createFieldEl(value) {
  const el = document.createElement('textarea');
  el.value = value;
  el.setAttribute('autocomplete', 'off');
  el.setAttribute('autocapitalize', 'off');
  el.setAttribute('spellcheck', 'false');
  el.addEventListener('input', () => handleInput(el));
  el.addEventListener('blur', maybeApplyPendingRemote);
  return el;
}

function renderAll() {
  container.innerHTML = '';
  elements = state.map(value => {
    const el = createFieldEl(value);
    container.appendChild(el);
    return el;
  });
}

function handleInput(el) {
  const idx = elements.indexOf(el);
  if (idx === -1) return;
  const value = el.value;
  state[idx] = value;

  if (value === '' && idx !== elements.length - 1) {
    elements.splice(idx, 1);
    state.splice(idx, 1);
    el.remove();
  } else if (value !== '' && idx === elements.length - 1) {
    const newEl = createFieldEl('');
    elements.push(newEl);
    state.push('');
    container.appendChild(newEl);
  }

  schedulePublish();
}

function schedulePublish() {
  clearTimeout(publishTimer);
  publishTimer = setTimeout(publishState, 450);
}

async function publishState() {
  if (suppressPublish) return;
  try {
    await fetch(NTFY_BASE, {
      method: 'POST',
      body: JSON.stringify(state)
    });
  } catch (err) {
    console.error('Publish failed:', err);
  }
}

function anyFieldFocused() {
  return elements.some(el => el === document.activeElement);
}

function applyRemoteState(remote) {
  if (!Array.isArray(remote) || remote.length === 0) remote = [''];
  if (remote[remote.length - 1] !== '') remote = remote.concat(['']);
  const same = remote.length === state.length && remote.every((v, i) => v === state[i]);
  if (same) return;
  suppressPublish = true;
  state = remote.slice();
  renderAll();
  suppressPublish = false;
}

function maybeApplyPendingRemote() {
  setTimeout(() => {
    if (pendingRemote && !anyFieldFocused()) {
      const remote = pendingRemote;
      pendingRemote = null;
      applyRemoteState(remote);
    }
  }, 0);
}

function onRemoteMessage(raw) {
  let remote;
  try {
    remote = JSON.parse(raw);
  } catch (err) {
    return;
  }
  if (anyFieldFocused()) {
    pendingRemote = remote;
  } else {
    applyRemoteState(remote);
  }
}

async function loadInitial() {
  try {
    const res = await fetch(NTFY_BASE + '/json?poll=1&since=latest');
    if (res.ok) {
      const text = await res.text();
      const lines = text.trim().split('\n').filter(Boolean);
      if (lines.length) {
        const last = JSON.parse(lines[lines.length - 1]);
        if (last && typeof last.message === 'string') {
          onRemoteMessage(last.message);
        }
      }
    }
  } catch (err) {
    console.error('Initial load failed:', err);
  }
}

function connectStream() {
  try {
    const es = new EventSource(NTFY_BASE + '/sse');
    es.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data && data.event === 'message' && typeof data.message === 'string') {
          onRemoteMessage(data.message);
        }
      } catch (err) {
        // ignore malformed events
      }
    };
    es.onerror = () => {
      es.close();
      setTimeout(connectStream, 3000);
    };
  } catch (err) {
    setTimeout(connectStream, 3000);
  }
}

let blanked = false;
document.addEventListener('dblclick', () => {
  blanked = !blanked;
  overlay.style.display = blanked ? 'block' : 'none';
});

renderAll();
loadInitial().then(connectStream);
</script>

</body>
</html>
